[project]
name = "crate"
version = "0.1.0"
description = "Ableton-first audio sample organizer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "pyyaml>=6",
  "send2trash>=1.8",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.40", "scikit-learn>=1.4"]
mac = ["pyobjc-framework-Cocoa>=10.3"]
slice = ["demucs>=4.1"]  # ingest --slice; use with the ml extra

[project.scripts]
crate = "crate.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-Send2Trash",
  "scikit-learn>=1.4",  # tests train the classifier on synthetic embeddings
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["research"]  # prototypes, not the package

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/crate"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
